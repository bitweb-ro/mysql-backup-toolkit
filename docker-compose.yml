services:
  # Server MySQL local — opțional, doar pentru testare. Nu e necesar dacă
  # aplicația backup-uiește exclusiv servere MySQL externe. Se pornește doar
  # explicit cu: docker-compose --profile local-mysql up
  mysql:
    # 8.4 = LTS. Altă versiune: MYSQL_TEST_IMAGE=mysql:8.0 în .env
    image: ${MYSQL_TEST_IMAGE:-mysql:8.4}
    container_name: mysql-backup-db
    restart: unless-stopped
    profiles: ["local-mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testdb}
      MYSQL_USER: ${MYSQL_USER:-backupuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-backuppassword}
    ports:
      - "${PORT_APP_MYSQL:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-config:/etc/mysql/conf.d
    command: >
      --log-bin=mysql-bin
      --server-id=1
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --binlog-expire-logs-seconds=604800
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-rootpassword}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    platform: linux/amd64
    container_name: mysql-backup-app
    restart: unless-stopped
    ports:
      - "${PORT_APP_BACKEND:-3001}:3001"
    environment:
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:-secret}
      JWT_SECRET: ${JWT_SECRET:-mysql-backup-manager-secret-key}
      PORT: 3001
    volumes:
      - app_data:/app/backend/data
      - ${BACKUP_PATH:-./backup_servers}:/app/backup_servers
    # Imaginea nu are curl; se folosește node. Login cu body gol răspunde 401,
    # deci orice status < 500 înseamnă că serverul HTTP funcționează.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
  app_data:
